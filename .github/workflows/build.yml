name: Build Kit

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the library
        shell: bash
        run: |
          set +e
          gradle :kit:assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "^e: |What went wrong|^> [^T]|Could not|rror:" build.log | grep -v "^> Task" | head -12 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status
